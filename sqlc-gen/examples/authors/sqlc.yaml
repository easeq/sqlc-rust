version: "2"
plugins:
  - name: rust-gen
    env:
      - RUST_BACKTRACE
      - RUST_LOG
    wasm:
      url: file://./../../../target/wasm32-wasip1/release/sqlc-gen.wasm
      sha256: 1054dcee8a9933b0fce9ee5a1dd82f4b7159185779bdcb07c6777603f2533a31
#
# - name: js
#   process:
#     cmd: sqlc-gen-json
sql:
  - schema: postgresql/schema.sql
    queries: postgresql/query.sql
    engine: postgresql
    codegen:
      - out: postgresql
        plugin: rust-gen
        options:
          use_async: true
          use_deadpool: false
