version: "2"
plugins:
  - name: rust-gen
    env:
      - RUST_BACKTRACE
      - RUST_LOG
    wasm:
      url: file://./../../../target/wasm32-wasip1/release/sqlc-gen.wasm
      sha256: e849d26f34b89f6ff5ed72ea74ead950d00812aef3c4785497a8b370b0759d58
#
# - name: js
#   process:
#     cmd: sqlc-gen-json
sql:
  - schema: postgresql/schema.sql
    queries: postgresql/query.sql
    engine: postgresql
    codegen:
      - out: postgresql
        plugin: rust-gen
        options:
          use_async: true
          use_deadpool: false
