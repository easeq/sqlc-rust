version: "2"
plugins:
  - name: rust-gen
    env:
      - RUST_BACKTRACE
      - RUST_LOG
    wasm:
      url: file://./../../../target/wasm32-wasip1/release/sqlc-gen.wasm
      sha256: 3024c8587a7528d3b8b806f33be80c9a10b55fe2a35a241b44830592e5f722de
#
# - name: js
#   process:
#     cmd: sqlc-gen-json
sql:
  - schema: postgresql/schema.sql
    queries: postgresql/query.sql
    engine: postgresql
    codegen:
      - out: gen
        plugin: rust-gen
        options:
          use_async: true
          use_deadpool: false
