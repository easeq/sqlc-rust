version: "2"
plugins:
  - name: rust-gen
    env:
      - RUST_BACKTRACE
      - RUST_LOG
    wasm:
      url: file://./../../target/wasm32-wasip1/release/sqlc-gen.wasm
      sha256: 96b53b8ec5aa5a706a879be771084cdf3d2fe141907220bfc28e320bbb4b3f5b
# - name: js
#   process:
#     cmd: sqlc-gen-json
sql:
  - schema: postgresql/migrations/
    queries: postgresql/query.sql
    engine: postgresql
    codegen:
      - out: src/db
        plugin: rust-gen
        options:
          use_async: true
          use_deadpool: true
          rules:
            - type: '*'
              derive:
                - Clone
                - Debug
                - PartialEq
    # - out: gen
    #   plugin: js
