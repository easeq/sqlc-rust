[package]
name = "authors"
version = "0.1.0"
edition = "2021"

[dependencies]
itertools = "0.13.0"
postgres = "0.19.9"
postgres-derive = "0.4.6"
postgres-types = "0.2.8"
postgresql_embedded = { version = "0.16.3", features = ["blocking", "bundled"] }
refinery = { version = "0.8.14", features = ["postgres"] }
serde = { version = "1.0.210", optional = true }
serde_json = { version = "1.0.128", optional = true }
sqlc-core = { path = "../../sqlc-core", features = ["with-bit-vec-0_6", "with-cidr-0_2", "with-eui48-1", "with-geo-types-0_7", "with-serde_json-1", "with-time-0_3", "with-uuid-1", "with-rust_decimal-postgres"] }

[features]
default = ["serde_support"]
serde_support = ["serde", "serde_json"]
