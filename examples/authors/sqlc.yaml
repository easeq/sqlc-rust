version: "2"
plugins:
  - name: rust-gen
    env:
      - RUST_BACKTRACE
      - RUST_LOG
    wasm:
      url: file://./../../target/wasm32-wasip1/release/sqlc-gen.wasm
      sha256: b8c267c4a1f5c4fa73c3b0293f25587ad3097d4e7687618dd2004b19e716472f
# - name: js
#   process:
#     cmd: sqlc-gen-json
sql:
  - schema: postgresql/migrations/
    queries: postgresql/query.sql
    engine: postgresql
    codegen:
      - out: src/db
        plugin: rust-gen
        options:
          #   use_async: true
          use_deadpool: false
          rules:
            - type: '*'
              derive:
                - Clone
                - Debug
                - PartialEq
    # - out: gen
    #   plugin: js
