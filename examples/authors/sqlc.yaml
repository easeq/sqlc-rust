version: "2"
plugins:
  - name: rust-gen
    env:
      - RUST_BACKTRACE
      - RUST_LOG
    wasm:
      url: file://./../../target/wasm32-wasip1/release/sqlc-gen.wasm
      sha256: b4248b764d270e19c54fe5e27dffbaf56cd4b80f63669014a924d0a56f42c632
# - name: js
#   process:
#     cmd: sqlc-gen-json
sql:
  - schema: postgresql/migrations/
    queries: postgresql/query.sql
    engine: postgresql
    codegen:
      - out: src/db
        plugin: rust-gen
        options:
          #   use_async: true
          use_deadpool: false
          rules:
            - type: '*'
              derive:
                - Clone
                - Debug
                - PartialEq
    # - out: gen
    #   plugin: js
