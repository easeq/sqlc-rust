version: "2"
plugins:
  - name: rust-gen
    env:
      - RUST_BACKTRACE
      - RUST_LOG
    wasm:
      url: file://./../../target/wasm32-wasip1/release/sqlc-gen.wasm
      sha256: f46dd3f455c7d7c4436056bc0e1d3f971cd66f7ee5767d7ce098c7b44125e026
# - name: js
#   process:
#     cmd: sqlc-gen-json
sql:
  - schema: postgresql/migrations/
    queries: postgresql/query.sql
    engine: postgresql
    codegen:
      - out: src/db
        plugin: rust-gen
        options:
          #   use_async: true
          use_deadpool: false
          rules:
            - type: '*'
              derive:
                - Clone
                - Debug
                - PartialEq
    # - out: gen
    #   plugin: js
