[package]
name = "authors-async"
version = "0.1.0"
edition = "2021"

[dependencies]
itertools = "0.13.0"
postgres-derive = "0.4.6"
postgres-types = "0.2.8"
postgresql_embedded = { version = "0.16.3", features = ["blocking", "bundled"] }
refinery = { version = "0.8.14", features = ["tokio-postgres"] }
serde = { version = "1.0.210", optional = true }
serde_json = { version = "1.0.128", optional = true }
sqlc-core = { path = "../../sqlc-core", default-features = false, features = ["with-bit-vec-0_6", "with-cidr-0_2", "with-eui48-1", "with-geo-types-0_7", "with-serde_json-1", "with-time-0_3", "with-tokio-postgres", "with-uuid-1", "with-rust_decimal-tokio-postgres"] }
tokio = { version = "1.40.0", features = ["rt", "rt-multi-thread", "macros", "signal"] }
tokio-postgres = { version = "0.7.12", features = ["with-uuid-1", "with-time-0_3", "array-impls"] }

[features]
default = ["serde_support"]
serde_support = ["serde", "serde_json"]
